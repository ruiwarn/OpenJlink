name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test,modbus]"
      - run: ruff check scripts tests --select F,E9
      - name: Check Skill documentation language
        shell: python
        run: |
          from pathlib import Path
          import re
          paths = [Path("SKILL.md"), Path("agents/openai.yaml"), *Path("references").rglob("*.md")]
          invalid = [str(path) for path in paths if re.search(r"[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]", path.read_text(encoding="utf-8"))]
          assert not invalid, f"Keep Skill materials in English; CJK text found in: {invalid}"
          blocks = [re.findall(r"^```[^\n]*\n(.*?)^```", Path(name).read_text(encoding="utf-8"), re.M | re.S) for name in ("README.md", "README.zh-CN.md")]
          assert blocks[0] == blocks[1], "Keep bilingual README commands in sync"
      - run: python -m pytest -q
      - run: openjlink --version
      - run: openjlink schema
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Verify installed wheel outside checkout
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          import venv
          import zipfile
          wheel, = Path("dist").glob("*.whl")
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              assert "openjlink/analysis/viewer.html" in names
              assert any(name.endswith("/licenses/LICENSES/MKLink-MIT.txt") for name in names)
          expected_version = subprocess.check_output([sys.executable, "-m", "openjlink", "--version"], text=True).strip()
          with tempfile.TemporaryDirectory(dir=os.environ["RUNNER_TEMP"]) as temporary:
              root = Path(temporary)
              venv.EnvBuilder(with_pip=True).create(root / "env")
              bin_dir = root / "env" / ("Scripts" if os.name == "nt" else "bin")
              python = bin_dir / ("python.exe" if os.name == "nt" else "python")
              subprocess.run([str(python), "-m", "pip", "install", str(wheel.resolve()) + "[modbus]"], check=True)
              subprocess.run([str(python), "-m", "pip", "check"], check=True)
              environment = {**os.environ, "PATH": str(bin_dir) + os.pathsep + os.environ["PATH"]}
              environment.pop("PYTHONPATH", None)
              command = "openjlink.exe" if os.name == "nt" else "openjlink"
              version = subprocess.check_output([command, "--version"], cwd=root, env=environment, text=True).strip()
              assert version == expected_version
              schema = json.loads(subprocess.check_output([command, "schema"], cwd=root, env=environment, text=True))
              assert len(schema) == 51
              requests = '{"id":1,"operation":"ping"}\n{"id":2,"operation":"device_status"}\n'
              result = subprocess.run([command, "--state-dir", str(root / "state"), "session"], input=requests, cwd=root,
                                      env=environment, capture_output=True, text=True, check=True, timeout=15)
              responses = [json.loads(line) for line in result.stdout.splitlines()]
              assert len(responses) == 2 and [row["id"] for row in responses] == [1, 2]
              assert all(row["ok"] for row in responses) and responses[1]["result"]["connected"] is False
